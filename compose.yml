services:
  ollama:
    build:
      context: .
      dockerfile: deploy/ollama.Dockerfile
    image: inference-gateway-ollama # models baked in; all replicas share this one image
    deploy:
      replicas: 2 # qwen3:4b @ 8k ctx = 3.9 GB each; a 3rd would spill out of the 12 GB GPU
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1 # one request per container; nginx spreads the load
    # no volume on /root/.ollama: it would hide the models baked into the image

  lb:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ollama

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_URL=http://lb:11434
    depends_on:
      - lb

  # ---- telemetry ----
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # localhost only: Prometheus has no auth

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true # local dev: view dashboards without logging in
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/inference-gateway.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.1 # reads nvidia-smi; DCGM exporter doesn't run on WSL2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  node-exporter:
    image: prom/node-exporter:v1.9.1 # CPU/memory of the Docker VM (cAdvisor can't see containers on Docker Desktop + Engine 29)
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro

volumes:
  prometheus-data:
  grafana-data:
