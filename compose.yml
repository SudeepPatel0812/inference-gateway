services:
  ollama:
    image: ollama/ollama:latest
    deploy:
      replicas: 2 # qwen3:4b @ 8k ctx = 3.9 GB each; a 3rd would spill out of the 12 GB GPU
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1 # one request per container; nginx spreads the load
    volumes:
      - ollama-models:/root/.ollama # shared, so a model is pulled once for all replicas

  lb:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ollama

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_URL=http://lb:11434
    depends_on:
      - lb

volumes:
  ollama-models:
