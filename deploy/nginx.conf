events {}

http {
  upstream ollama {
    least_conn;
    # resolves to every replica's IP at startup; restart lb after changing the replica count
    server ollama:11434;
  }

  server {
    listen 11434;

    location / {
      proxy_pass http://ollama;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      # long generations take minutes; nginx's 60s default would cut them off
      proxy_read_timeout 600s;
    }
  }
}
