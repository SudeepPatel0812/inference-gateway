global:
  scrape_interval: 5s # short for a dev box; 15-30s is typical in production

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"] # GET /metrics on the Go gateway
  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9835"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
